name: Publish Docker Image

# Trigger workflow on push to any branch or tag, and on pull requests to any branch
on:
  push:
    branches: [ "*" ]
    # Publish semver tags as releases.
    tags: [ '*' ]
  pull_request:
    #branches: [ "main" ]
    branches: [ "*" ]
  schedule:
    # Check for new PHP versions daily at midnight UTC
    - cron: '0 0 * * *'

# Environment variables for Docker registry and image name
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: docker.io
  # github.repository as <account>/<repo>
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: anyshpm/php
  # Default PHP version to build
  PHP_VERSION: "8.2"

jobs:
  check-php-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check-version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Extract current PHP version from Dockerfile
      - name: Get current PHP version
        id: get-version
        run: |
          CURRENT_VERSION=$(grep -oP 'FROM php:\K[0-9.]+' Dockerfile | head -1)
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "Current PHP version: ${CURRENT_VERSION}"

      # Check for new PHP 8.2 versions
      - name: Check for new PHP version
        id: check-version
        uses: actions/github-script@v6
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'php',
              repo: 'php-src',
              per_page: 10
            });
            const latestVersion = releases.find(r => r.tag_name.startsWith('php-8.2.'));
            const currentVersion = process.env.CURRENT_VERSION;
            if (latestVersion && latestVersion.tag_name !== `php-${currentVersion}`) {
              const newVersion = latestVersion.tag_name.replace('php-', '');
              core.setOutput('new_version', newVersion);
              core.summary.addHeading('PHP Version Update Summary');
              core.summary.addRaw(`<p>Current version: ${currentVersion}</p>`);
              core.summary.addRaw(`<p>New version detected: ${newVersion}</p>`);
              core.summary.addRaw('<p>Update required: ✅ Yes</p>');
              await core.summary.write();
              return `New PHP version detected: ${latestVersion.tag_name}`;
            } else {
              core.summary.addHeading('PHP Version Update Summary');
              core.summary.addRaw(`<p>Current version: ${currentVersion}</p>`);
              core.summary.addRaw('<p>Update required: ❌ No</p>');
              await core.summary.write();
              return 'No new PHP version found.';
            }

  build:
    needs: check-php-version
    if: needs.check-php-version.outputs.new_version == '' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Update PHP version if new version detected
      - name: Update PHP version
        if: needs.check-php-version.outputs.new_version != ''
        run: |
          sed -i "s/PHP_VERSION=.*/PHP_VERSION=${{ needs.check-php-version.outputs.new_version }}/" Dockerfile
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add Dockerfile
          git commit -m "Update PHP to ${{ needs.check-php-version.outputs.new_version }}"
          git push

      # Install cosign for signing Docker images (skip on PR)
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.4.0
        with:
          cosign-release: 'v2.2.3'

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      # Login to Docker registry (skip on PR)
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main,priority=900
            type=ref,event=tag,priority=800
            type=ref,event=branch,suffix=-beta,priority=700

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

  create-pr:
    needs: check-php-version
    if: needs.check-php-version.outputs.new_version != '' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update PHP to ${{ needs.check-php-version.outputs.new_version }}"
          title: "Update PHP to ${{ needs.check-php-version.outputs.new_version }}"
          body: "Automated PR to update PHP version to ${{ needs.check-php-version.outputs.new_version }}"
          branch: "update-php-${{ needs.check-php-version.outputs.new_version }}"
