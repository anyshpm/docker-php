name: Publish Docker Image & Create Release

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: anyshpm/php

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # 用于 Cosign 签名完成 Fulcio 身份挑战

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0
        with:
          cosign-release: 'v2.2.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.ref_name) }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 使用 Cosign 进行无密钥身份签名
      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}

      # 自动创建 GitHub Release 页面
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          RELEASE_BODY=$(cat <<EOF
          ## 🚀 PHP Image Release \`${TAG_NAME}\`

          ### 📦 Docker Hub Information
          - **Image**: [\`${IMAGE_NAME}:${TAG_NAME}\`](https://hub.docker.com/r/${IMAGE_NAME})
          - **Platforms**: \`linux/amd64\`, \`linux/arm64\`
          - **Image Digest**: \`${DIGEST}\`

          ### 📥 Pull Command
          \`\`\`bash
          docker pull ${IMAGE_NAME}:${TAG_NAME}
          \`\`\`

          ### 🧩 Included Extensions & Tools
          - **Database**: \`pdo\`, \`pdo_mysql\`, \`mysqli\`
          - **Image**: \`gd\` (freetype, jpeg), PECL \`imagick\`
          - **System & IPC**: \`sysvsem\` (Nextcloud 信号量优化), \`sockets\` (Zabbix 优化), \`posix\`, \`pcntl\`
          - **Utility & Cryptography**: \`intl\`, \`mbstring\`, \`bcmath\`, \`gmp\`, \`sodium\`, \`opcache\`, \`xml\`, \`zip\`
          - **Tools**: \`Composer\`, \`git\`, \`sudo\`

          ### 🛡️ Supply Chain Security
          This image is signed using [Sigstore Cosign](https://github.com/sigstore/cosign) with keyless transparency logs on Rekor.
          EOF
          )

          # 如果对应 Release 已经存在则更新，不存在则创建
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "Release ${TAG_NAME}" --notes "$RELEASE_BODY"
          else
            gh release create "${TAG_NAME}" --title "Release ${TAG_NAME}" --notes "$RELEASE_BODY"
          fi
