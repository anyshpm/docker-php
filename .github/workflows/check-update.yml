name: Check PHP Update & Test Build

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动执行检测
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force test build even if no new version detected'
        required: false
        default: false
        type: boolean

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest PHP version from Docker Hub
        id: check
        run: |
          chmod +x scripts/check-latest-php.sh
          ./scripts/check-latest-php.sh Dockerfile

      - name: Check update decision
        id: decision
        run: |
          HAS_UPDATE="${{ steps.check.outputs.has_update }}"
          FORCE="${{ inputs.force_build }}"
          if [ "$HAS_UPDATE" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "should_proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.decision.outputs.should_proceed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decision.outputs.should_proceed == 'true'
        uses: docker/setup-buildx-action@v3

      # 测试构建：验证多架构编译和扩展安装是否成功，不推送到远程仓库
      - name: Test build Docker image
        if: steps.decision.outputs.should_proceed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 仅在检测到新版本且测试构建通过后提交更新并打 Tag
      - name: Commit, Tag, and Push
        if: steps.check.outputs.has_update == 'true'
        env:
          NEW_TAG: ${{ steps.check.outputs.latest_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add Dockerfile
          git commit -m "chore(deps): bump PHP base image to ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "Release PHP ${NEW_TAG}"

          # 推送代码提交与 tag
          git push origin HEAD
          git push origin "${NEW_TAG}"

      # 触发发布工作流（规避 GITHUB_TOKEN 直接 push tag 无法级联触发 workflow 的限制）
      - name: Trigger Release Workflow
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.check.outputs.latest_tag }}
        run: |
          echo "Triggering release workflow for tag: ${NEW_TAG}"
          gh workflow run docker-buildx.yml --ref "${NEW_TAG}" || echo "Triggered via git tag or workflow dispatch"
